name: Test

on:
  push:
  pull_request:

jobs:
  test:
    # Python 3.9 is unavailable on the Ubuntu 26.04 image.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
        octoprint-version: ["1.11.7", "2.0.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install OctoPrint and the plugin
        run: |
          python -m pip install --upgrade pip
          python -m pip install "OctoPrint==${{ matrix.octoprint-version }}"
          python -m pip install -e ".[develop]"
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Run tests
        run: python -m pytest
